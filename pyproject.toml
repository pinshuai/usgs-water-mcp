[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usgs-water-mcp"
version = "0.1.0"
description = "MCP server for USGS water data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.1",
    "plotly>=5.0.0",
]

[project.scripts]
usgs-water-mcp = "usgs_water_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usgs_water_mcp"]
